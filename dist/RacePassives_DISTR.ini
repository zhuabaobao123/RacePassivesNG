; Race Passives - optional SPID distribution, so NPCs get their race's passives too.
; Requires Spell Perk Item Distributor (SPID). Delete this file for player-only.
;
; Strength follows the in-game slider: the plugin rewrites the spell magnitudes, so an
; NPC gets whatever intensity you set. Set a race to 0% and its NPCs get nothing either.
;
; SPID never distributes to the player, so this cannot double up on your own passives.

; --- the ten playable races ---------------------------------------------------
Spell = RPNordFrostAffinity||NordRace
Spell = RPOrcRage||OrcRace
Spell = RPBretonAncestry||BretonRace
Spell = RPDunmerAncestry||DarkElfRace
Spell = RPAltmerAncestry||HighElfRace
Spell = RPKhajiitAgility||KhajiitRace
Spell = RPArgonianBlood||ArgonianRace
Spell = RPRedguardVigor||RedguardRace
Spell = RPBosmerHunter||WoodElfRace
Spell = RPImperialVirtue||ImperialRace

; --- their vampire variants, so a vampire NPC keeps its race's set -------------
Spell = RPNordFrostAffinity||NordRaceVampire
Spell = RPOrcRage||OrcRaceVampire
Spell = RPBretonAncestry||BretonRaceVampire
Spell = RPDunmerAncestry||DarkElfRaceVampire
Spell = RPAltmerAncestry||HighElfRaceVampire
Spell = RPKhajiitAgility||KhajiitRaceVampire
Spell = RPArgonianBlood||ArgonianRaceVampire
Spell = RPRedguardVigor||RedguardRaceVampire
Spell = RPBosmerHunter||WoodElfRaceVampire
Spell = RPImperialVirtue||ImperialRaceVampire
